<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220">
  <defs>
    <linearGradient id="vsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06121e"/>
      <stop offset="50%" stop-color="#0b1e33"/>
      <stop offset="100%" stop-color="#06121e"/>
    </linearGradient>
    <linearGradient id="vsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="vsGlow" cx="20%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06121e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="vsGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.4"/>
      <circle cx="28" cy="28" r="0.75" fill="#334155" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="220" rx="14" fill="url(#vsBg)"/>
  <rect width="800" height="220" rx="14" fill="url(#vsGlow)"/>
  <rect width="800" height="220" rx="14" fill="url(#vsGrid)"/>
  <rect width="798" height="218" x="1" y="1" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <g transform="translate(55, 45)">
    <rect width="130" height="130" rx="24" fill="#0b1726" stroke="#334155" stroke-width="1.5"/>
    <rect width="130" height="130" rx="24" fill="none" stroke="url(#vsAccent)" stroke-width="1.5" stroke-opacity="0.4"/>

    <g transform="translate(65, 65)">
      <!-- Security Shield Outer -->
      <path d="M 0 -42 L 32 -26 C 32 14 18 36 0 46 C -18 36 -32 14 -32 -26 Z" fill="#0f2338" stroke="url(#vsAccent)" stroke-width="2.2" stroke-linejoin="round"/>
      
      <!-- Receipt Document Notch Inside Shield -->
      <path d="M -16 -18 L 16 -18 L 16 18 L 10 14 L 0 18 L -10 14 L -16 18 Z" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="-10" y1="-10" x2="10" y2="-10" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-10" y1="-4" x2="6" y2="-4" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-10" y1="2" x2="8" y2="2" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Verification Checkmark Badge -->
      <circle cx="16" cy="16" r="11" fill="#10b981" stroke="#0b1726" stroke-width="2"/>
      <path d="M 12 16 L 15 19 L 20 13" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(215, 58)">
    <g transform="translate(0, 0)">
      <rect width="132" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
      <circle cx="10" cy="10" r="3" fill="#34d399"/>
      <text x="18" y="13.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a7f3d0" letter-spacing="0.5">FINTECH PLATFORM</text>
    </g>

    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      VERISPEND
    </text>

    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
      Multi-Tenant AI Expense Review &amp; Compliance Platform
    </text>

    <g transform="translate(0, 94)">
      <rect x="0" y="0" width="128" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#10b981"/>
      <text x="22" y="15.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">ASP.NET Core 8</text>

      <rect x="138" y="0" width="120" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="150" cy="12" r="3" fill="#3b82f6"/>
      <text x="160" y="15.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Vision AI OCR</text>

      <rect x="268" y="0" width="128" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="280" cy="12" r="3" fill="#f59e0b"/>
      <text x="290" y="15.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Immutable Audit</text>

      <rect x="406" y="0" width="118" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="418" cy="12" r="3" fill="#a855f7"/>
      <text x="428" y="15.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Tenant Scoped</text>
    </g>
