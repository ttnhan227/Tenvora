name: tenvora_mobile
description: Compact native mobile workspace for the Tenvora business platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  google_sign_in: ^7.2.0
  file_picker: ^13.1.0
  csv: ^8.0.0
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo-mark.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/logo-mark.png"
  # Android's adaptive icon is maintained in res/mipmap-anydpi-v26 and uses a
  # native vector foreground so launcher masks never show a nested square tile.
  remove_alpha_ios: true
