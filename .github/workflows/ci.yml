name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify-product:
    uses: ./.github/workflows/verify-product.yml

  # ===== BACKEND TESTS =====
  backend-test:
    name: Build & Test .NET Solution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Dependencies
        run: dotnet restore Tenvora.sln

      - name: Build Solution
        run: dotnet build Tenvora.sln --no-restore -c Release

      - name: Run Backend Tests
        run: dotnet test Tenvora.sln --no-build -c Release --verbosity normal

  # ===== FRONTEND TESTS =====
  frontend-test:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        working-directory: client
        run: npm ci

      - name: Run Linter
        working-directory: client
        run: npm run lint

      - name: Run Unit Tests
        working-directory: client
        run: npm test -- --run

      - name: Build Frontend
        working-directory: client
        run: npm run build

  # ===== SECURITY SCANNING =====
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ===== BUILD & VALIDATE DOCKER IMAGES =====
  build-docker:
    name: Build & Push Docker Images
    needs: [backend-test, frontend-test, verify-product, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata (client)
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/client
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-gcp:
    name: Deploy verified backend to Google Cloud Run
    needs: [build-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: tenvora-gcp-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: tenvora
          workload_identity_provider: projects/495244344153/locations/global/workloadIdentityPools/github-tenvora/providers/github
          service_account: github-deploy@tenvora.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push immutable backend image
        env:
          IMAGE: asia-southeast1-docker.pkg.dev/tenvora/cloud-run-source-deploy/tenvora-api:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" ./server
          docker push "$IMAGE"
      - name: Deploy image and check database readiness
        env:
          IMAGE: asia-southeast1-docker.pkg.dev/tenvora/cloud-run-source-deploy/tenvora-api:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud run deploy tenvora-api --project tenvora --region asia-southeast1 --image "$IMAGE" --quiet
          URL=$(gcloud run services describe tenvora-api --project tenvora --region asia-southeast1 --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$URL/api/health" | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ready"'
