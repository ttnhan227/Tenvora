name: Tenvora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Build & Test .NET API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Dependencies
        run: dotnet restore server/Tenvora.Api.csproj

      - name: Build Backend
        run: dotnet build server/Tenvora.Api.csproj --no-restore

      - name: Run Backend Tests
        run: dotnet test server.Tests/Tenvora.Tests.csproj

  frontend-build:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Run Frontend Tests
        run: cd client && npm test -- --run

      - name: Build Frontend
        run: cd client && npm run build
