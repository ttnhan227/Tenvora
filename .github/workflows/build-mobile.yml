name: Build & Release Mobile APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a signed APK after verification (only when ready to release)'
        type: boolean
        default: false
      api_base_url:
        description: 'Backend API Base URL (leave empty to use default)'
        required: false
        default: ''

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-product:
    uses: ./.github/workflows/verify-product.yml
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest
    needs: verify-product
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          java -version

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Check Mobile Code Quality
        working-directory: mobile
        run: flutter analyze

      - name: Test Mobile Workflows
        working-directory: mobile
        run: flutter test

      - name: Setup Signing Keystore (if secrets provided)
        id: signing
        working-directory: mobile/android
        env:
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES" ]; then
            echo "Decoded production upload keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > tenvora-upload-key.jks
            echo "$KEY_PROPERTIES" > key.properties
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::Publishing requires ANDROID_KEY_PROPERTIES and ANDROID_KEYSTORE_BASE64."
              exit 1
            fi
            echo "No production upload key secrets detected; building with debug-signed release configuration."
          fi

      - name: Build Android Release APK
        working-directory: mobile
        env:
          INPUT_API_URL: ${{ inputs.api_base_url }}
          CONFIG_API_URL: ${{ vars.MOBILE_API_BASE_URL || secrets.MOBILE_API_BASE_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID || secrets.GOOGLE_SERVER_CLIENT_ID }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          API_URL="${INPUT_API_URL:-$CONFIG_API_URL}"
          if [ -z "$API_URL" ]; then
            echo "::error::MOBILE_API_BASE_URL is not set! Please configure MOBILE_API_BASE_URL in GitHub Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

          DART_DEFINES="--dart-define=API_BASE_URL=$API_URL"
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            echo "Configuring GOOGLE_SERVER_CLIENT_ID in APK"
            DART_DEFINES="$DART_DEFINES --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_CLIENT_ID"
          else
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::Publishing requires GOOGLE_SERVER_CLIENT_ID."
              exit 1
            fi
            echo "Notice: GOOGLE_SERVER_CLIENT_ID variable not set. APK will build without Google Sign-In support."
          fi

          echo "Building APK with API_BASE_URL=$API_URL"
          if [ "$PUBLISH" = "true" ]; then
            case "$API_URL" in https://*) ;; *) echo "::error::Published APK requires an HTTPS backend."; exit 1 ;; esac
            flutter build apk --release $DART_DEFINES
          else
            flutter build apk --release -PallowDebugReleaseSigning=true $DART_DEFINES
          fi

      - name: Stage APK Output
        run: |
          mkdir -p dist
          SOURCE_APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$SOURCE_APK" ]; then
            SOURCE_APK=$(find mobile/build/app/outputs/flutter-apk -type f -name "*.apk" | head -n 1)
          fi

          if [ -f "$SOURCE_APK" ]; then
            cp "$SOURCE_APK" dist/tenvora-mobile.apk
            echo "Successfully staged APK: $(ls -lh dist/tenvora-mobile.apk)"
          else
            echo "Error: No APK artifact found in outputs."
            exit 1
          fi

      - name: Verify distribution signing certificate
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          ACTUAL=$("$APKSIGNER" verify --print-certs dist/tenvora-mobile.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(tr -d '\r\n' < mobile/android/signing-certificate.sha256)
          echo "APK certificate SHA-256: $ACTUAL"
          echo "Expected certificate SHA-256: $EXPECTED"
          test "$ACTUAL" = "$EXPECTED" || { echo '::error::APK certificate does not match the distribution key.'; exit 1; }

      - name: Upload GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenvora-mobile-apk
          path: dist/tenvora-mobile.apk
          retention-days: 30

      - name: Generate Product Release Notes
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          cat << 'EOF' > release_body.md
          ## What's New in Tenvora Mobile

          ### ✨ Key Features
          * **Fast Sales & Expense Entry:** Record counter sales and cash payments in seconds with automatic debt tracking.
          * **Camera Receipt Capture:** Photograph supplier receipts and paper invoices to attach them directly to your permanent records.
          * **Customer & Supplier Balances:** Check who owes what in real time, view purchase history, and log payments on the go.
          * **Instant Web & Cloud Sync:** Transactions logged on your phone sync instantly with your web dashboard and ledger.
          * **Bilingual (English & Tiếng Việt):** Native VND currency formatting, Vietnamese phone numbers, and language toggle.

          ---
          ### 🛠️ What's Changed
          EOF
          git log -n 6 --no-merges --pretty=format:"* %s" >> release_body.md

      - name: Publish to GitHub Releases (mobile-latest)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: "Tenvora Mobile for Android"
          body_path: release_body.md
          draft: false
          prerelease: false
          files: dist/tenvora-mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
