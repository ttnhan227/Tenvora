services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: VeriSpend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d VeriSpend"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=VeriSpend;Username=postgres;Password=postgres
      JwtSettings__Secret: local-development-jwt-secret-change-before-production
      CLIENT_ORIGINS: http://localhost:5173
      APP_BASE_URL: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    command: sh -c "test -x node_modules/.bin/vite || npm ci; npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  client_node_modules:
